name: BSOS
description: BSOS is a Web3 infrastructure company building compliant financial rails across emerging
  markets and institutional finance. It operates two core lines of business - compliant stablecoin payment
  networks for cross-border USD settlement in emerging markets (starting with Latin America), and
  institutional-grade real-world asset (RWA) tokenization systems for leading financial institutions in
  Asia. Its products include Velaro for cross-border USD payments, RWA SuiteX for asset tokenization, and
  SUPLEX for supply chain finance. BSOS is a portfolio company backed by 500 Global.
